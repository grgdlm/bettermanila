title: Legislative Department
description: The Sangguniang Panlungsod ng Maynila is the city council. For
  the 2025 to 2028 term it has 38 councilors — 36 elected from the city's six
  councilor districts plus two ex-officio members — with the Vice Mayor
  presiding. Pages on its committees and how an ordinance is made are still
  being written.
